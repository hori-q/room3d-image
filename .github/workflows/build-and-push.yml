# GitHub Actions でイメージをビルドして Docker Hub に Push する(自分のパソコンでビルドしない場合)。
# 使い方: リポジトリの .github/workflows/ にこのファイルを置き、リポジトリ直下に Dockerfile と start.sh を置く。
#        Settings → Secrets and variables → Actions に DOCKERHUB_USERNAME と DOCKERHUB_TOKEN を登録し、
#        Actions タブから「build-and-push」を手動実行する。
name: build-and-push

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # イメージが大きいため、ランナーの空き容量を確保する(標準では空きが25〜29GB程度)
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show free disk space
        run: df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/room3d-wilddet3d:1.0
