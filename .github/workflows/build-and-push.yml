# GitHub Actions でイメージをビルドして Docker Hub に Push する(自分のパソコンでビルドしない場合)。
# 使い方: リポジトリの .github/workflows/ にこのファイルを置き、リポジトリ直下に Dockerfile と start.sh を置く。
#        Settings → Secrets and variables → Actions に DOCKERHUB_USERNAME と DOCKERHUB_TOKEN を登録し、
#        Actions タブから「build-and-push」を手動実行する。
#
# ビルドは4つの段階(pkgs → ops → wd3d → final)に分けて順に実行し、段階ごとに、ビルドキャッシュを
# Docker Hub(同じリポジトリの「buildcache」タグ)に保存する。途中の段階で失敗しても、成功済みの段階は
# 次回の実行でキャッシュから再利用される(失敗した段階だけがやり直しになる)。
name: build-and-push

on:
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/room3d-wilddet3d
  IMAGE_TAG: "1.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # イメージが大きいため、ランナーの空き容量を確保する(標準では空きが25〜29GB程度)
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show free disk space
        run: df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "段階1/4: pkgs(pipパッケージ)"
        uses: docker/build-push-action@v6
        with:
          context: .
          target: pkgs
          push: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: "段階2/4: ops(vis4d_cuda_ops のCUDAビルド)"
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ops
          push: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: "段階3/4: wd3d(WildDet3D)"
        uses: docker/build-push-action@v6
        with:
          context: .
          target: wd3d
          push: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: "段階4/4: final(JupyterLab・最終確認)+ Push"
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
